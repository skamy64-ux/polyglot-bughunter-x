name: Bug report
description: Something in PolyglotBugHunter-X is wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security reports go to `security@polyglot-bughunter-x.dev`, not here.**
        See [SECURITY.md](https://github.com/Kicaulah/polyglot-bughunter-x/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest thing that shows the bug.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [detection, report rendering, static space, gradio space, i18n, safety, other]
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target, if any
      description: |
        What did you point the tool at? If it is not the bundled demo target,
        say whether you are authorized to test it.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "v1.0.0 or a commit sha"
